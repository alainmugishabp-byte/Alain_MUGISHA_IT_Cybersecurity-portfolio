# Short-term containment: block the infected host and the malicious destination.
config firewall address
  edit "INFECTED_10.10.10.50"
    set subnet 10.10.10.50 255.255.255.255
  next
  edit "C2_203.0.113.50"
    set subnet 203.0.113.50 255.255.255.255
  next
end
config firewall policy
  edit 1
    set name "IR-Block-Infected-Host"
    set srcintf "vlan10"
    set dstintf "any"
    set srcaddr "INFECTED_10.10.10.50"
    set dstaddr "all"
    set action deny
    set schedule "always"
    set service "ALL"
    set logtraffic all
  next
  edit 2
    set name "IR-Block-C2"
    set srcintf "any"
    set dstintf "wan1"
    set srcaddr "all"
    set dstaddr "C2_203.0.113.50"
    set action deny
    set schedule "always"
    set service "ALL"
    set logtraffic all
  next
end
