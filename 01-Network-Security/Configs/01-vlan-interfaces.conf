# FortiGate VLAN interfaces (HQ). Reference config for lab; adapt port names to your VM.
config system interface
  edit "vlan10"
    set vdom "root"
    set interface "port2"
    set vlanid 10
    set alias "USERS"
    set ip 10.10.10.1 255.255.255.0
    set allowaccess ping
    set role lan
  next
  edit "vlan20"
    set vdom "root"
    set interface "port2"
    set vlanid 20
    set alias "SERVERS"
    set ip 10.10.20.1 255.255.255.0
    set allowaccess ping
    set role lan
  next
  edit "vlan30"
    set vdom "root"
    set interface "port2"
    set vlanid 30
    set alias "MGMT"
    set ip 10.10.30.1 255.255.255.0
    set allowaccess ping https ssh
    set role lan
  next
  edit "vlan40"
    set vdom "root"
    set interface "port2"
    set vlanid 40
    set alias "GUEST"
    set ip 10.10.40.1 255.255.255.0
    set allowaccess ping
    set role lan
  next
  edit "vlan50"
    set vdom "root"
    set interface "port3"
    set vlanid 50
    set alias "DMZ"
    set ip 10.10.50.1 255.255.255.0
    set allowaccess ping
    set role dmz
  next
end
