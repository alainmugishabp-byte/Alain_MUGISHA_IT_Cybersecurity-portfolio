# Baseline policy set that enforces the traffic matrix (reports/traffic-matrix.md)
config firewall policy
  edit 10
    set name "Users-to-Internet"
    set srcintf "vlan10"
    set dstintf "wan1"
    set srcaddr "all"
    set dstaddr "all"
    set action accept
    set schedule "always"
    set service "HTTP" "HTTPS" "DNS"
    set utm-status enable
    set ssl-ssh-profile "certificate-inspection"
    set webfilter-profile "default"
    set ips-sensor "default"
    set nat enable
    set logtraffic all
  next
  edit 20
    set name "Users-to-Web-Servers"
    set srcintf "vlan10"
    set dstintf "vlan20"
    set srcaddr "all"
    set dstaddr "all"
    set action accept
    set schedule "always"
    set service "HTTPS"
    set logtraffic all
  next
  edit 30
    set name "Guest-to-Internet-Only"
    set srcintf "vlan40"
    set dstintf "wan1"
    set srcaddr "all"
    set dstaddr "all"
    set action accept
    set schedule "always"
    set service "HTTP" "HTTPS" "DNS"
    set nat enable
    set logtraffic all
  next
  edit 999
    set name "Deny-All-Log"
    set srcintf "any"
    set dstintf "any"
    set srcaddr "all"
    set dstaddr "all"
    set action deny
    set schedule "always"
    set service "ALL"
    set logtraffic all
  next
end
# Security profile names vary by license/version; adjust or remove the utm lines if unavailable.
