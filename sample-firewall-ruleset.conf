# =============================================================
# Sample FortiGate Firewall Policy Set (SANITIZED)
# Purpose: demonstrates policy structure, segmentation approach,
#          and logging practice — no real IPs, hostnames, or
#          client-identifying information included.
# =============================================================

# --- Address Objects ---
config firewall address
    edit "LAN-SUBNET"
        set subnet 192.0.2.0 255.255.255.0      # placeholder RFC5737 test range
    next
    edit "DMZ-SUBNET"
        set subnet 198.51.100.0 255.255.255.0   # placeholder RFC5737 test range
    next
    edit "MGMT-HOST"
        set subnet 203.0.113.10 255.255.255.255 # placeholder RFC5737 test range
    next
end

# --- Address Group (for admin access) ---
config firewall addrgrp
    edit "ADMIN-ALLOWED"
        set member "MGMT-HOST"
    next
end

# --- Service Objects (using built-in services where possible) ---
# HTTPS, SSH, DNS are built-in FortiGate services; referenced directly below.

# --- Policy 1: Internal LAN -> Internet (general web access, logged) ---
config firewall policy
    edit 10
        set name "LAN-to-WAN-Web"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "LAN-SUBNET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "HTTP" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set logtraffic all
        set nat enable
    next

    # --- Policy 2: DMZ -> Internal (blocked by default, explicit deny) ---
    edit 20
        set name "DMZ-to-LAN-Deny"
        set srcintf "dmz"
        set dstintf "internal"
        set srcaddr "DMZ-SUBNET"
        set dstaddr "LAN-SUBNET"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # --- Policy 3: Admin management access (restricted source, MFA-backed) ---
    edit 30
        set name "Mgmt-SSH-HTTPS-Access"
        set srcintf "internal"
        set dstintf "internal"
        set srcaddr "ADMIN-ALLOWED"
        set dstaddr "MGMT-HOST"
        set action accept
        set schedule "always"
        set service "SSH" "HTTPS"
        set logtraffic all
        set groups "IT-Admins"
    next

    # --- Policy 4: Default deny (explicit, for audit clarity) ---
    edit 999
        set name "Default-Deny-Logged"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# =============================================================
# Notes on approach (for reviewers):
# - Rules ordered most-specific to least-specific, ending in an
#   explicit default-deny with logging enabled for audit trail.
# - UTM profiles (AV, web filter, SSL inspection) applied on the
#   general egress rule rather than globally, to balance
#   performance and visibility.
# - Admin/management access restricted to a named address group
#   rather than "all", reducing blast radius if a rule is
#   accidentally duplicated or misconfigured.
# - All addresses above use RFC 5737 documentation ranges
#   (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) and are not
#   real infrastructure.
# =============================================================
