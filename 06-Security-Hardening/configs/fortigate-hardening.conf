config system global
  set hostname "HQ-FGT-01"
  set admintimeout 10
  set admin-lockout-threshold 3
  set admin-lockout-duration 300
  set strong-crypto enable
  set admin-https-redirect enable
  set admin-https-ssl-versions tlsv1-2 tlsv1-3
  set pre-login-banner enable
  set post-login-banner enable
end
config system password-policy
  set status enable
  set minimum-length 12
  set min-upper-case-letter 1
  set min-lower-case-letter 1
  set min-number 1
  set min-non-alphanumeric 1
  set expire-status enable
  set expire-day 90
end
config system admin
  edit "netadmin"
    set accprofile "super_admin"
    set trusthost1 10.10.30.0 255.255.255.0
    set password <STRONG_PASSWORD>
  next
end
config system interface
  edit "vlan30"
    set allowaccess ping https ssh
  next
  edit "wan1"
    set allowaccess ping
  next
end
config system ntp
  set ntpsync enable
  set type fortiguard
end
config log fortianalyzer setting
  set status enable
  set server 10.10.30.20
  set upload-option realtime
  set reliable enable
end
# Rename/disable the default "admin" account after creating netadmin.
# Some options differ by FortiOS version; verify with "tab" completion in the CLI.
