# =============================================================
# Sample FortiGate Site-to-Site IPsec VPN Configuration (SANITIZED)
# Purpose: demonstrates a standard route-based IPsec VPN setup
#          between two sites — no real IPs, PSKs, or hostnames.
# =============================================================

# --- Phase 1 (IKE) Configuration ---
config vpn ipsec phase1-interface
    edit "Site-to-Site-VPN"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256               # AES-256 / SHA-256, no legacy DES/MD5
        set dhgrp 14                              # Diffie-Hellman group 14 (2048-bit) minimum
        set remote-gw 203.0.113.50                # placeholder RFC5737 test IP (remote peer)
        set psksecret <REDACTED-USE-STRONG-PSK>   # never store real PSK in version control
        set dpd on-idle
        set dpd-retryinterval 10
    next
end

# --- Phase 2 (IPsec SA) Configuration ---
config vpn ipsec phase2-interface
    edit "Site-to-Site-VPN-P2"
        set phase1name "Site-to-Site-VPN"
        set proposal aes256-sha256
        set src-subnet 192.0.2.0 255.255.255.0     # placeholder local subnet
        set dst-subnet 198.51.100.0 255.255.255.0  # placeholder remote subnet
        set keylifeseconds 3600
        set pfs enable
        set dhgrp 14
    next
end

# --- Static Route for VPN Traffic ---
config router static
    edit 1
        set dst 198.51.100.0 255.255.255.0
        set device "Site-to-Site-VPN"
    next
end

# --- Firewall Policy: Local LAN <-> Remote Site over VPN ---
config firewall policy
    edit 40
        set name "VPN-Local-to-Remote"
        set srcintf "internal"
        set dstintf "Site-to-Site-VPN"
        set srcaddr "LAN-SUBNET"
        set dstaddr "REMOTE-LAN-SUBNET"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 41
        set name "VPN-Remote-to-Local"
        set srcintf "Site-to-Site-VPN"
        set dstintf "internal"
        set srcaddr "REMOTE-LAN-SUBNET"
        set dstaddr "LAN-SUBNET"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# =============================================================
# Notes on approach (for reviewers):
# - IKEv2 used over IKEv1 for stronger negotiation and built-in
#   NAT-T / DPD support.
# - AES-256/SHA-256 with DH group 14 as the minimum acceptable
#   cipher suite — avoids legacy/deprecated algorithms.
# - Perfect Forward Secrecy (PFS) enabled on Phase 2 so a
#   compromised key doesn't expose past traffic.
# - Dead Peer Detection (DPD) set to on-idle to detect and
#   recover from a dropped tunnel without manual intervention.
# - PSK is intentionally redacted — real secrets are managed via
#   a password manager / vault, never committed to source control.
# - All IPs are RFC 5737 documentation ranges, not real infrastructure.
# =============================================================
